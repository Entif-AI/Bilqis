<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Bilqis Mission Control</title>
    <link rel="stylesheet" href="./visual-tokens.css" />
    <link rel="stylesheet" href="./shell.css" />
    <link rel="stylesheet" href="./components.css" />
    <link rel="stylesheet" href="./frame-explorer.css" />
    <link rel="stylesheet" href="./home/home.css" />
    <link rel="stylesheet" href="./atlas/semantic-atlas.css" />
    <link rel="stylesheet" href="./capability/dossier.css" />
    <link rel="stylesheet" href="./school/school.css" />
    <link rel="stylesheet" href="./neural/neural.css" />
    <link rel="stylesheet" href="./episodes/episodes.css" />
    <link rel="stylesheet" href="./memory/memory.css" />
    <link rel="stylesheet" href="./teacher/teacher.css" />
    <link rel="stylesheet" href="./corrections/corrections.css" />
    <link rel="stylesheet" href="./salience/salience.css" />
    <link rel="stylesheet" href="./lineage/lineage.css" />
    <link rel="stylesheet" href="./evidence/evidence.css" />
    <link rel="stylesheet" href="./resources/resources.css" />
    <link rel="stylesheet" href="./interactions/interactions.css" />
    <link rel="stylesheet" href="./operate/operate.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="shell.skipToMain" data-test-id="shell-skip-main"></a>
    <div id="shell" class="shell" data-posture="unknown">
      <aside class="rail" data-test-id="shell-rail">
        <div class="brand" data-test-id="shell-brand">
          <strong data-i18n="shell.brand"></strong>
        </div>
        <nav id="primary-nav" data-test-id="shell-navigation"></nav>
        <button id="palette-trigger" class="utility-button ui-control ui-control--secondary" type="button"
                aria-keyshortcuts="Control+K" data-i18n-aria-label="shell.command.triggerAria"
                data-test-id="shell-command-trigger">
          <span data-i18n="shell.command.trigger"></span><kbd>⌘K</kbd>
        </button>
      </aside>

      <main id="main-content" class="workspace" tabindex="-1">
        <header class="context-bar" data-test-id="shell-context-bar">
          <div class="context-primary">
            <div class="identity" data-test-id="shell-run-identity">
              <span id="mode-badge" class="mode-badge" data-test-id="shell-mode-badge"></span>
              <div><strong id="run-id"></strong><small id="generation-id" data-test-id="shell-generation-summary"></small></div>
            </div>
            <span id="freshness" class="freshness" data-test-id="shell-freshness"></span>
          </div>
          <div class="context-actions">
            <details id="system-context-disclosure" class="context-disclosure" data-test-id="shell-system-context-disclosure">
              <summary class="ui-control ui-control--tertiary" data-i18n="shell.context.system"></summary>
              <div class="context-popover ui-surface ui-surface-2 ui-surface--bounded">
                <div id="context-facts" class="context-facts" data-i18n-aria-label="shell.context.systemAria"></div>
              </div>
            </details>
            <details id="view-settings-disclosure" class="context-disclosure" data-test-id="shell-view-settings-disclosure">
              <summary class="ui-control ui-control--tertiary" data-i18n="shell.context.viewSettings"></summary>
              <div class="context-popover context-settings ui-surface ui-surface-2 ui-surface--bounded"
                   data-i18n-aria-label="shell.context.viewSettingsAria">
                <button id="theme-trigger" class="ui-control ui-control--mode" type="button"
                        data-test-id="shell-theme-trigger"></button>
                <button id="density-trigger" class="ui-control ui-control--mode" type="button"
                        data-test-id="shell-density-trigger"></button>
              </div>
            </details>
          </div>
        </header>

        <section id="investigation-strip" class="investigation-strip" aria-label="Global investigation tools"></section>
        <section id="defensive-banner" class="defensive-banner" aria-live="polite" aria-atomic="true"
                 data-test-id="shell-defensive-banner"></section>
        <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"
             data-test-id="shell-announcer"></div>

        <section id="view-host" class="view-host" aria-labelledby="view-title">
          <header class="destination-header" data-test-id="shell-destination-header">
            <h1 id="view-title" data-test-id="shell-destination-title"></h1>
            <p id="view-summary" data-test-id="shell-destination-purpose"></p>
            <span id="view-posture" class="destination-posture" hidden data-test-id="shell-destination-posture"></span>
          </header>
          <nav id="model-nav" class="model-nav" hidden data-i18n-aria-label="shell.model.subnav"
               data-test-id="shell-model-subnav">
            <button class="ui-control ui-control--peer-tab" type="button" data-model-section="neural"
                    data-i18n="shell.model.neural" data-test-id="shell-model-neural"></button>
            <button class="ui-control ui-control--peer-tab" type="button" data-model-section="frames"
                    data-i18n="shell.model.frames" data-test-id="shell-model-frames"></button>
          </nav>
          <section id="frame-explorer" hidden data-i18n-aria-label="shell.model.frames"
                   data-test-id="model-frame-workspace-host"></section>
          <p id="domain-context-note" hidden data-i18n="shell.reference.contextNote"
             data-test-id="shell-reference-context-note"></p>
          <section id="domain-context-boundary" class="domain-context-boundary" hidden>
            <div><span class="status-dot" aria-hidden="true"></span><strong data-i18n="shell.reference.label"></strong></div>
            <p data-i18n="shell.reference.description"></p>
            <div class="demo-actions" id="demo-actions"></div>
          </section>
          <section id="visual-catalog" class="visual-catalog" aria-label="Scientific visual language catalog"></section>
          <section id="domain-view" class="domain-view" aria-label="Current domain view"></section>
        </section>
      </main>

      <aside id="inspector" class="inspector" role="dialog" aria-labelledby="inspector-title" aria-hidden="true" inert>
        <div class="inspector-heading">
          <div><span class="eyebrow">Global inspector</span><h2 id="inspector-title">No selection</h2></div>
          <button id="inspector-close" type="button" aria-label="Close inspector">×</button>
        </div>
        <dl id="inspector-details"></dl>
        <div class="inspector-actions">
          <button id="open-owner" data-test-id="inspector-open-owner" type="button">Open in owning view</button>
          <button id="open-evidence" data-test-id="inspector-open-evidence" type="button">Open evidence</button>
          <button id="pin-selection" type="button">Pin exact object</button>
          <button id="compare-left" type="button">Set compare left</button>
          <button id="compare-right" type="button">Set compare right</button>
          <button id="annotate-selection" type="button">Add operator note</button>
        </div>
      </aside>

      <dialog id="command-palette" class="command-palette" aria-labelledby="palette-title"
              data-test-id="shell-command-palette">
        <div class="palette-heading">
          <div><span class="eyebrow" data-i18n="shell.command.paletteEyebrow"></span><h2 id="palette-title" data-i18n="shell.command.paletteTitle"></h2></div>
          <button id="palette-close" type="button" data-i18n-aria-label="shell.command.paletteClose"
                  data-test-id="shell-palette-close">×</button>
        </div>
        <p data-i18n="shell.command.paletteDescription"></p>
        <div id="palette-options" class="palette-options" data-test-id="shell-palette-options"></div>
      </dialog>
    </div>
    <script type="module" src="./renderer.mjs"></script>
  </body>
</html>
