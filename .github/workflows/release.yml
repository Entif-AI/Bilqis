name: Bilqis MLX versioned private release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout tagged private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up isolated Python for MLX readiness
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify SemVer matches annotated tag and changelog
        run: python3 -B scripts/maintenance/release_version.py --check --require-tag
      - name: Install BAMF release-readiness dependencies
        run: >-
          python3 -m pip install -e .
          -r lib/ithkuil/requirements-semantic.txt
          mlx==0.31.1 numpy==2.4.4
      - name: Verify core source and selected portable contracts
        run: |
          python3 -B scripts/check_historical_abi.py
          python3 -B scripts/check_semantic_boundaries.py
          python3 -B scripts/check_factory_architecture.py
          python3 -B scripts/error_control_plane.py --check
          python3 -B -m unittest -q scripts.tests.test_release_version
          python3 -B scripts/code_smell_audit.py --check-baseline docs/evidence/development/code_smell_baseline.json
      - name: Verify launch-critical BAMF journey with no skipped tests
        run: npm run bamf:readiness

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create private GitHub release from reviewed changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B scripts/maintenance/release_version.py --check --require-tag
          python3 -B scripts/maintenance/release_version.py --notes > /tmp/bilqis-release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Existing release verified; no duplicate publication.'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Bilqis MLX $GITHUB_REF_NAME" \
              --notes-file /tmp/bilqis-release-notes.md
          fi
