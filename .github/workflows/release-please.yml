name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Trigger required CI checks on generated release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(jq -r '.[0].headBranchName // empty' <<< "$RELEASE_PRS")
          [[ "$branch" == release-please--branches--main ]] || {
            echo 'Unexpected release PR head; refusing workflow dispatch' >&2
            exit 1
          }
          gh workflow run test.yml --ref "$branch" -R "$GITHUB_REPOSITORY"
          gh workflow run conventional-commits.yml --ref "$branch" -R "$GITHUB_REPOSITORY"
