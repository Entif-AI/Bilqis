name: Conventional Commits

on:
  pull_request:
    branches: [main, codex/bamf-unified-base-20261028]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title and every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/maintenance/release_version.py --validate-subject "$PR_TITLE"
          while IFS=$'\t' read -r commit subject; do
            echo "Validating commit subject $commit"
            python3 -B scripts/maintenance/release_version.py --validate-subject "$subject"
          done < <(
            python3 -B scripts/quality/pr_scope.py commits \
              --base-sha "$BASE_SHA" \
              --head-sha "$HEAD_SHA" \
              --head-ref "$HEAD_REF"
          )
