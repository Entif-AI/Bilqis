name: conventional-commits

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check PR title and commits (squash-merge compatibility)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose
          npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
